name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version and lowercase image name
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "Building version ${{ steps.version.outputs.version }} for ${{ steps.version.outputs.image }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg GIT_COMMIT=${GITHUB_SHA::7} \
            -t ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }} \
            -t ${{ steps.version.outputs.image }}:latest \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.version.outputs.image }}:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Deploy staging (Remote SSH)
        if: env.STAGING_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d \
              --name mlops-api \
              --restart unless-stopped \
              -p 5000:5000 \
              ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Deploy staging (Runner Container)
        if: env.STAGING_HOST == ''
        run: |
          echo "STAGING_HOST secret not configured. Running staging container on GitHub Actions runner..."
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker stop mlops-api || true
          docker rm mlops-api || true
          docker run -d \
            --name mlops-api \
            --restart unless-stopped \
            -p 5000:5000 \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Smoke test
        run: |
          HOST="${STAGING_HOST:-localhost}"
          sleep 5
          curl --fail http://${HOST}:5000/health

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
    steps:
      - name: Deploy production (Remote SSH)
        if: env.PRODUCTION_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d \
              --name mlops-api \
              --restart unless-stopped \
              -p 5000:5000 \
              ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

      - name: Deploy production (Runner Container)
        if: env.PRODUCTION_HOST == ''
        run: |
          echo "PRODUCTION_HOST secret not configured. Running production container on GitHub Actions runner..."
          docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
          docker stop mlops-api || true
          docker rm mlops-api || true
          docker run -d \
            --name mlops-api \
            --restart unless-stopped \
            -p 5000:5000 \
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
